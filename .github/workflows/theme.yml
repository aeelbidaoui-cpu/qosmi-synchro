name: Qosmi - theme

on:
  workflow_dispatch:
    inputs:
      action:
        description: "exporter (lecture seule) ou appliquer (copie non publiée)"
        type: choice
        options: [exporter, exporter-apercu, appliquer, theme-rk, publier, activer-fiches, photos-marques, controle-photos, qualite-photos, masquer-photos-faibles, photos-adp, photos-hero, photos-ici, photos-cadre, pages-legales, seo-boutique, controle-boutique, google, testeurs-suspens, photos-manquantes, photos-jm, photos-mm, photos-tfi, photos-ck, photos-tt, photos-lvmh, photos-m2, photos-m3, livraison-2-95, page-favoris, page-odeurs, page-quiz, odeurs-filtre, photo-fiche, politiques, politiques-nl, textes-fiches, menu, nl-audit, nl-traduire, nl-publier, nl-emails, nl-emails-envoyer, seo-marques, seo-marques-essai, seo-collections-vides, seo-prix-unitaire, photos-ambiance, seo-alt-nl, social-medias-lot1]
        default: exporter
      fiche:
        description: "photos-marques : renvoyer seulement cette fiche (adresse de la fiche)"
        type: string
        default: ""
      essai:
        description: "photos-marques : ne traiter qu'une fiche dont la photo vient de ce site (ex. parfumerie.be)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Refuser de tourner si le dépôt est public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prive=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "Dépôt privé : $prive (10/11/2026 : Amine a choisi de passer le dépôt en public ; plus d'arrêt)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Thème
        env:
          SHOPIFY_BOUTIQUE: ${{ secrets.SHOPIFY_BOUTIQUE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          WF_URL: ${{ secrets.WF_URL }}
          PHOTOS_ESSAI: ${{ inputs.essai }}
          PHOTOS_FICHE: ${{ inputs.fiche }}
        run: |
          if [ "${{ inputs.action }}" = "activer-fiches" ]; then python -u scripts/site_synchro.py --activer
          elif [ "${{ inputs.action }}" = "photos-marques" ]; then
            if [ -z "$PHOTOS_ESSAI" ]; then pip install -q pillow && python -u scripts/photos_marques.py; fi
            python -u scripts/site_synchro.py --photos-marques
          elif [ "${{ inputs.action }}" = "textes-fiches" ]; then python -u scripts/site_synchro.py --textes
          elif [ "${{ inputs.action }}" = "nl-audit" ]; then python -u scripts/site_nl.py --audit
          elif [ "${{ inputs.action }}" = "nl-traduire" ]; then python -u scripts/site_nl.py --traduire
          elif [ "${{ inputs.action }}" = "nl-emails-envoyer" ]; then python -u scripts/site_nl.py --emails-envoyer
          elif [ "${{ inputs.action }}" = "nl-emails" ]; then python -u scripts/site_nl.py --emails
          elif [ "${{ inputs.action }}" = "nl-publier" ]; then python -u scripts/site_nl.py --publier
          elif [ "${{ inputs.action }}" = "seo-boutique" ]; then python -u scripts/seo_boutique.py
          elif [ "${{ inputs.action }}" = "seo-marques" ]; then python -u scripts/seo_marques.py
          elif [ "${{ inputs.action }}" = "photos-ambiance" ]; then python -u scripts/photos_ambiance.py
          elif [ "${{ inputs.action }}" = "seo-alt-nl" ]; then python -u scripts/seo_alt_nl.py
          elif [ "${{ inputs.action }}" = "social-medias-lot1" ]; then python -u scripts/social_medias.py social/lot1/lot1.json
          elif [ "${{ inputs.action }}" = "seo-marques-essai" ]; then python -u scripts/seo_marques.py --essai
          elif [ "${{ inputs.action }}" = "seo-collections-vides" ]; then python -u scripts/seo_plus.py --collections-vides
          elif [ "${{ inputs.action }}" = "seo-prix-unitaire" ]; then python -u scripts/seo_plus.py --prix-unitaire
          elif [ "${{ inputs.action }}" = "controle-boutique" ]; then python -u scripts/controle_boutique.py
          elif [ "${{ inputs.action }}" = "google" ]; then python -u scripts/site_synchro.py --google
          elif [ "${{ inputs.action }}" = "page-favoris" ]; then python -u scripts/page_favoris.py
          elif [ "${{ inputs.action }}" = "page-odeurs" ]; then python -u scripts/page_odeurs.py
          elif [ "${{ inputs.action }}" = "page-quiz" ]; then python -u scripts/page_quiz.py
          elif [ "${{ inputs.action }}" = "odeurs-filtre" ]; then python -u scripts/odeurs_filtre.py
          elif [ "${{ inputs.action }}" = "photo-fiche" ]; then python -u scripts/photo_fiche.py
          elif [ "${{ inputs.action }}" = "livraison-2-95" ]; then python -u scripts/livraison_tarif.py 7 2.95
          elif [ "${{ inputs.action }}" = "photos-m3" ]; then python -u scripts/photos_dossier.py m3
          elif [ "${{ inputs.action }}" = "photos-m2" ]; then python -u scripts/photos_dossier.py m2
          elif [ "${{ inputs.action }}" = "photos-tt" ]; then python -u scripts/photos_dossier.py tt
          elif [ "${{ inputs.action }}" = "photos-lvmh" ]; then python -u scripts/photos_dossier.py lvmh
          elif [ "${{ inputs.action }}" = "photos-ck" ]; then python -u scripts/photos_dossier.py ck
          elif [ "${{ inputs.action }}" = "photos-tfi" ]; then python -u scripts/photos_dossier.py tfi
          elif [ "${{ inputs.action }}" = "photos-mm" ]; then python -u scripts/photos_dossier.py mm
          elif [ "${{ inputs.action }}" = "photos-jm" ]; then python -u scripts/photos_dossier.py jm
          elif [ "${{ inputs.action }}" = "photos-manquantes" ]; then python -u scripts/site_synchro.py --photos-manquantes
          elif [ "${{ inputs.action }}" = "testeurs-suspens" ]; then python -u scripts/site_synchro.py --testeurs-suspens
          elif [ "${{ inputs.action }}" = "politiques-nl" ]; then python -u scripts/site_pages.py --politiques-nl
          elif [ "${{ inputs.action }}" = "politiques" ]; then python -u scripts/site_pages.py --politiques
          elif [ "${{ inputs.action }}" = "pages-legales" ]; then python -u scripts/site_pages.py
          elif [ "${{ inputs.action }}" = "photos-adp" ]; then python -u scripts/photos_adp.py
          elif [ "${{ inputs.action }}" = "photos-cadre" ]; then pip install -q pillow numpy && python -u scripts/photos_cadre.py
          elif [ "${{ inputs.action }}" = "photos-hero" ]; then python -u scripts/photos_hero.py
          elif [ "${{ inputs.action }}" = "photos-ici" ]; then python -u scripts/photos_ici.py
          elif [ "${{ inputs.action }}" = "masquer-photos-faibles" ]; then python -u scripts/site_synchro.py --masquer-photos-faibles
          elif [ "${{ inputs.action }}" = "qualite-photos" ]; then python -u scripts/site_synchro.py --qualite-photos
          elif [ "${{ inputs.action }}" = "controle-photos" ]; then python -u scripts/site_synchro.py --controle-photos
          else python -u scripts/site_theme.py --${{ inputs.action }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-${{ github.run_id }}
          path: rapports/theme/
          retention-days: 7
          if-no-files-found: ignore
