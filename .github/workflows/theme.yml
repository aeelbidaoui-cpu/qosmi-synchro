name: Qosmi - theme

on:
  workflow_dispatch:
    inputs:
      action:
        description: "exporter (lecture seule) ou appliquer (copie non publiée)"
        type: choice
        options: [page-authenticite, pages-masquer, chat-icone, theme-lire, no-black-friday, page-a-propos, marche-nl-etat, marche-nl-domaine, marche-fr-etat, marche-fr-domaine, exporter, exporter-apercu, appliquer, theme-rk, publier, activer-fiches, photos-marques, controle-photos, qualite-photos, masquer-photos-faibles, photos-adp, photos-hero, photos-ici, photos-cadre, pages-legales, seo-boutique, controle-boutique, google, testeurs-suspens, testeurs-integres, photos-manquantes, photos-jm, photos-mm, photos-tfi, photos-ck, photos-tt, photos-lvmh, photos-m2, photos-m3, livraison-2-95, page-favoris, page-odeurs, page-quiz, page-faq, page-lexique, page-diagnostic, odeurs-filtre, odeurs-libelle, profils-parfums, collections-profils, bons-plans, code-bienvenue, code-amis, comparer-deloox, redirections-404, redirections-404-essai, commande-bons-plans, black-friday-analyse, black-friday, black-friday-retirer, inbox-publier, inbox-audit, inbox-nl, page-confidentialite, collections-cadeaux, telegram-test, livraison-modes-essai, livraison-modes, livraison-nl, pages-livraison, page-noel, alertes-stock, alertes-essai, alertes-prix-essai, alertes-simuler-retour, alertes-simuler-perdu, images-site, photo-fiche, politiques, politiques-nl, textes-fiches, menu, nl-audit, en-ajouter, en-audit, en-traduire, en-emails, en-politiques, en-publier, nl-traduire, nl-publier, nl-emails, nl-emails-envoyer, seo-marques, seo-marques-essai, seo-collections-vides, seo-prix-unitaire, photos-ambiance, seo-alt-nl, social-medias-lot1, photo-principale, pyramides-essai, pyramides, en-metaobjets, audit-fiches, etiquettes, photos-fiches-lot, politique-livraison, skincare-apercu, photos-notino-sonde, skincare-pause, photos-notino-lot, doublons-ean, video-mobile, audit-bouchon, politique-cgv, corriger-bouchon, image-noel, page-contact, chercher-ean, page-wholesale, test-expediteur, suivi-commandes, suivi-commandes-essai, social-liens, fiches-epuisees-essai, fiches-epuisees, fiches-en-ligne, google-refus-essai, google-refus, chercher-titre, prix-ean-chiffre]
        default: exporter
      fiche:
        description: "photos-marques : renvoyer seulement cette fiche (adresse de la fiche)"
        type: string
        default: ""
      essai:
        description: "photos-marques : ne traiter qu'une fiche dont la photo vient de ce site (ex. parfumerie.be)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Refuser de tourner si le dépôt est public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prive=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "Dépôt privé : $prive (10/11/2026 : Amine a choisi de passer le dépôt en public ; plus d'arrêt)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Thème
        env:
          SHOPIFY_BOUTIQUE: ${{ secrets.SHOPIFY_BOUTIQUE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          WF_URL: ${{ secrets.WF_URL }}
          TRISTA_URL: ${{ secrets.TRISTA_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHOTOS_ESSAI: ${{ inputs.essai }}
          PHOTOS_FICHE: ${{ inputs.fiche }}
          ALERTE_CLIENT: ${{ inputs.fiche }}
        run: |
          if [ "${{ inputs.action }}" = "page-authenticite" ]; then python -u scripts/page_authenticite.py
          elif [ "${{ inputs.action }}" = "pages-masquer" ]; then python -u scripts/seo_pages_masquees.py
          elif [ "${{ inputs.action }}" = "chat-icone" ]; then python -u scripts/site_theme.py --chat-icone
          elif [ "${{ inputs.action }}" = "theme-lire" ]; then MOTIFS="${{ inputs.fiche }}" python -u scripts/site_theme.py --lire
          elif [ "${{ inputs.action }}" = "activer-fiches" ]; then python -u scripts/site_synchro.py --activer
          elif [ "${{ inputs.action }}" = "marche-nl-etat" ]; then python -u scripts/marche_nl_domaine.py
          elif [ "${{ inputs.action }}" = "marche-nl-domaine" ]; then python -u scripts/marche_nl_domaine.py --appliquer
          elif [ "${{ inputs.action }}" = "marche-fr-etat" ]; then DOMAINE=qosmi.fr python -u scripts/marche_nl_domaine.py
          elif [ "${{ inputs.action }}" = "marche-fr-domaine" ]; then DOMAINE=qosmi.fr python -u scripts/marche_nl_domaine.py --appliquer
          elif [ "${{ inputs.action }}" = "photos-marques" ]; then
            if [ -z "$PHOTOS_ESSAI" ]; then pip install -q pillow && python -u scripts/photos_marques.py; fi
            python -u scripts/site_synchro.py --photos-marques
          elif [ "${{ inputs.action }}" = "textes-fiches" ]; then python -u scripts/site_synchro.py --textes
          elif [ "${{ inputs.action }}" = "nl-audit" ]; then python -u scripts/site_nl.py --audit
          elif [ "${{ inputs.action }}" = "en-publier" ]; then LANGUE=en python -u scripts/site_nl.py --publier
          elif [ "${{ inputs.action }}" = "en-emails" ]; then python -u scripts/emails_en.py && LANGUE=en python -u scripts/site_nl.py --emails-envoyer
          elif [ "${{ inputs.action }}" = "en-politiques" ]; then python -u scripts/site_pages.py --politiques-nl --en
          elif [ "${{ inputs.action }}" = "en-ajouter" ]; then LANGUE=en python -u scripts/site_nl.py --ajouter
          elif [ "${{ inputs.action }}" = "en-audit" ]; then LANGUE=en python -u scripts/site_nl.py --audit
          elif [ "${{ inputs.action }}" = "en-traduire" ]; then LANGUE=en python -u scripts/site_nl.py --traduire
          elif [ "${{ inputs.action }}" = "nl-traduire" ]; then python -u scripts/site_nl.py --traduire
          elif [ "${{ inputs.action }}" = "nl-emails-envoyer" ]; then python -u scripts/site_nl.py --emails-envoyer
          elif [ "${{ inputs.action }}" = "nl-emails" ]; then python -u scripts/site_nl.py --emails
          elif [ "${{ inputs.action }}" = "nl-publier" ]; then python -u scripts/site_nl.py --publier
          elif [ "${{ inputs.action }}" = "seo-boutique" ]; then python -u scripts/seo_boutique.py
          elif [ "${{ inputs.action }}" = "video-mobile" ]; then python -u scripts/video_mobile.py
          elif [ "${{ inputs.action }}" = "audit-bouchon" ]; then python -u scripts/audit_bouchon.py
          elif [ "${{ inputs.action }}" = "social-liens" ]; then python -u scripts/social_liens.py
          elif [ "${{ inputs.action }}" = "google-refus-essai" ]; then python -u scripts/google_refus.py
          elif [ "${{ inputs.action }}" = "google-refus" ]; then python -u scripts/google_refus.py --appliquer
          elif [ "${{ inputs.action }}" = "fiches-epuisees-essai" ]; then FICHES="${{ inputs.fiche }}" python -u scripts/fiches_epuisees.py
          elif [ "${{ inputs.action }}" = "fiches-epuisees" ]; then FICHES="${{ inputs.fiche }}" python -u scripts/fiches_epuisees.py --appliquer
          elif [ "${{ inputs.action }}" = "fiches-en-ligne" ]; then GARDER_STOCK=1 FICHES="${{ inputs.fiche }}" python -u scripts/fiches_epuisees.py --appliquer
          elif [ "${{ inputs.action }}" = "suivi-commandes" ]; then python -u scripts/suivi_commandes.py
          elif [ "${{ inputs.action }}" = "suivi-commandes-essai" ]; then python -u scripts/suivi_commandes.py --essai
          elif [ "${{ inputs.action }}" = "test-expediteur" ]; then python -u scripts/test_expediteur.py
          elif [ "${{ inputs.action }}" = "page-wholesale" ]; then python -u scripts/page_wholesale.py
          elif [ "${{ inputs.action }}" = "chercher-ean" ]; then python -u scripts/chercher_ean.py
          elif [ "${{ inputs.action }}" = "prix-ean-chiffre" ]; then CLE_PUBLIQUE="${{ inputs.fiche }}" EANS="$(cat config/eans_demande.txt 2>/dev/null || cat config/eans_niche.txt)" python -u scripts/prix_ean_chiffre.py
          elif [ "${{ inputs.action }}" = "chercher-titre" ]; then TITRES="${{ inputs.fiche }}" python -u scripts/chercher_titre.py
          elif [ "${{ inputs.action }}" = "page-contact" ]; then python -u scripts/page_contact.py
          elif [ "${{ inputs.action }}" = "image-noel" ]; then python -u scripts/remplacer_image.py qosmi-decor-coffret-noel.jpg
          elif [ "${{ inputs.action }}" = "corriger-bouchon" ]; then python -u scripts/corriger_bouchon.py
          elif [ "${{ inputs.action }}" = "politique-cgv" ]; then python -u scripts/site_pages.py --politiques --seulement conditions-generales-de-vente && python -u scripts/site_pages.py --politiques-nl --en --seulement conditions-generales-de-vente
          elif [ "${{ inputs.action }}" = "seo-marques" ]; then python -u scripts/seo_marques.py
          elif [ "${{ inputs.action }}" = "photos-ambiance" ]; then python -u scripts/photos_ambiance.py
          elif [ "${{ inputs.action }}" = "seo-alt-nl" ]; then python -u scripts/seo_alt_nl.py
          elif [ "${{ inputs.action }}" = "social-medias-lot1" ]; then python -u scripts/social_medias.py social/lot1/lot1.json
          elif [ "${{ inputs.action }}" = "seo-marques-essai" ]; then python -u scripts/seo_marques.py --essai
          elif [ "${{ inputs.action }}" = "seo-collections-vides" ]; then python -u scripts/seo_plus.py --collections-vides
          elif [ "${{ inputs.action }}" = "seo-prix-unitaire" ]; then python -u scripts/seo_plus.py --prix-unitaire
          elif [ "${{ inputs.action }}" = "controle-boutique" ]; then python -u scripts/controle_boutique.py
          elif [ "${{ inputs.action }}" = "google" ]; then python -u scripts/site_synchro.py --google
          elif [ "${{ inputs.action }}" = "page-favoris" ]; then python -u scripts/page_favoris.py
          elif [ "${{ inputs.action }}" = "page-odeurs" ]; then python -u scripts/page_odeurs.py
          elif [ "${{ inputs.action }}" = "page-quiz" ]; then python -u scripts/page_quiz.py
          elif [ "${{ inputs.action }}" = "page-faq" ]; then python -u scripts/page_faq.py
          elif [ "${{ inputs.action }}" = "page-lexique" ]; then python -u scripts/page_lexique.py
          elif [ "${{ inputs.action }}" = "no-black-friday" ]; then python -u scripts/no_black_friday.py
          elif [ "${{ inputs.action }}" = "page-a-propos" ]; then python -u scripts/page_a_propos.py
          elif [ "${{ inputs.action }}" = "page-diagnostic" ]; then python -u scripts/page_simple.py diagnostic
          elif [ "${{ inputs.action }}" = "odeurs-filtre" ]; then python -u scripts/odeurs_filtre.py
          elif [ "${{ inputs.action }}" = "alertes-stock" ]; then python -u scripts/alertes_stock.py
          elif [ "${{ inputs.action }}" = "images-site" ]; then python -u scripts/images_site.py
          elif [ "${{ inputs.action }}" = "profils-parfums" ]; then python -u scripts/fi_profils.py && python -u scripts/collections_profils.py
          elif [ "${{ inputs.action }}" = "collections-profils" ]; then python -u scripts/collections_profils.py
          elif [ "${{ inputs.action }}" = "collections-cadeaux" ]; then python -u scripts/collections_cadeaux.py
          elif [ "${{ inputs.action }}" = "telegram-test" ]; then python -u scripts/nouveautes_grossiste.py --test
          elif [ "${{ inputs.action }}" = "livraison-modes-essai" ]; then python -u scripts/livraison_modes.py --essai
          elif [ "${{ inputs.action }}" = "livraison-modes" ]; then python -u scripts/livraison_modes.py
          elif [ "${{ inputs.action }}" = "livraison-nl" ]; then python -u scripts/livraison_modes.py --traduire
          elif [ "${{ inputs.action }}" = "pages-livraison" ]; then python -u scripts/site_pages.py --seulement conditions-generales-de-vente,livraison
          elif [ "${{ inputs.action }}" = "page-noel" ]; then python -u scripts/page_simple.py noel
          elif [ "${{ inputs.action }}" = "alertes-essai" ]; then python -u scripts/alertes_stock.py --essai
          elif [ "${{ inputs.action }}" = "alertes-prix-essai" ]; then python -u scripts/alertes_prix.py --essai
          elif [ "${{ inputs.action }}" = "alertes-simuler-retour" ]; then python -u scripts/alertes_stock.py --simuler retour
          elif [ "${{ inputs.action }}" = "alertes-simuler-perdu" ]; then python -u scripts/alertes_stock.py --simuler perdu
          elif [ "${{ inputs.action }}" = "odeurs-libelle" ]; then python -u scripts/odeurs_filtre.py --libelle
          elif [ "${{ inputs.action }}" = "bons-plans" ]; then python -u scripts/bons_plans.py
          elif [ "${{ inputs.action }}" = "code-bienvenue" ]; then python -u scripts/code_bienvenue.py
          elif [ "${{ inputs.action }}" = "code-amis" ]; then python -u scripts/code_amis.py
          elif [ "${{ inputs.action }}" = "comparer-deloox" ]; then python -u scripts/comparer_deloox.py
          elif [ "${{ inputs.action }}" = "redirections-404" ]; then python -u scripts/redirections_404.py
          elif [ "${{ inputs.action }}" = "redirections-404-essai" ]; then python -u scripts/redirections_404.py --essai
          elif [ "${{ inputs.action }}" = "commande-bons-plans" ]; then python -u scripts/commande_bons_plans.py
          elif [ "${{ inputs.action }}" = "black-friday-analyse" ]; then python -u scripts/black_friday.py --analyse
          elif [ "${{ inputs.action }}" = "black-friday" ]; then python -u scripts/black_friday.py --appliquer "$PHOTOS_ESSAI"
          elif [ "${{ inputs.action }}" = "black-friday-retirer" ]; then python -u scripts/black_friday.py --retirer
          elif [ "${{ inputs.action }}" = "inbox-publier" ]; then python -u scripts/inbox_publier.py
          elif [ "${{ inputs.action }}" = "inbox-audit" ]; then python -u scripts/inbox_audit.py
          elif [ "${{ inputs.action }}" = "inbox-nl" ]; then python -u scripts/inbox_nl.py
          elif [ "${{ inputs.action }}" = "page-confidentialite" ]; then python -u scripts/site_pages.py --politiques-nl --seulement confidentialite
          elif [ "${{ inputs.action }}" = "photo-fiche" ]; then python -u scripts/photo_fiche.py
          elif [ "${{ inputs.action }}" = "photo-principale" ]; then python -u scripts/photo_principale.py
          elif [ "${{ inputs.action }}" = "pyramides-essai" ]; then pip install -q pillow && PYRAMIDES_FICHES="${{ inputs.fiche }}" python -u scripts/pyramides.py --poser --limite 5
          elif [ "${{ inputs.action }}" = "photos-fiches-lot" ]; then python -u scripts/photo_fiche.py --lot
          elif [ "${{ inputs.action }}" = "etiquettes" ]; then python -u scripts/etiquettes.py
          elif [ "${{ inputs.action }}" = "audit-fiches" ]; then python -u scripts/audit_fiches.py
          elif [ "${{ inputs.action }}" = "en-metaobjets" ]; then python -u scripts/metaobjets_en.py
          elif [ "${{ inputs.action }}" = "pyramides" ]; then pip install -q pillow && python -u scripts/pyramides.py --poser
          elif [ "${{ inputs.action }}" = "livraison-2-95" ]; then python -u scripts/livraison_tarif.py 7 2.95
          elif [ "${{ inputs.action }}" = "photos-m3" ]; then python -u scripts/photos_dossier.py m3
          elif [ "${{ inputs.action }}" = "photos-m2" ]; then python -u scripts/photos_dossier.py m2
          elif [ "${{ inputs.action }}" = "photos-tt" ]; then python -u scripts/photos_dossier.py tt
          elif [ "${{ inputs.action }}" = "photos-lvmh" ]; then python -u scripts/photos_dossier.py lvmh
          elif [ "${{ inputs.action }}" = "photos-ck" ]; then python -u scripts/photos_dossier.py ck
          elif [ "${{ inputs.action }}" = "photos-tfi" ]; then python -u scripts/photos_dossier.py tfi
          elif [ "${{ inputs.action }}" = "photos-mm" ]; then python -u scripts/photos_dossier.py mm
          elif [ "${{ inputs.action }}" = "photos-jm" ]; then python -u scripts/photos_dossier.py jm
          elif [ "${{ inputs.action }}" = "photos-manquantes" ]; then python -u scripts/site_synchro.py --photos-manquantes
          elif [ "${{ inputs.action }}" = "testeurs-integres" ]; then python -u scripts/site_synchro.py --testeurs-integres
          elif [ "${{ inputs.action }}" = "testeurs-suspens" ]; then python -u scripts/site_synchro.py --testeurs-suspens
          elif [ "${{ inputs.action }}" = "politiques-nl" ]; then python -u scripts/site_pages.py --politiques-nl
          elif [ "${{ inputs.action }}" = "politiques" ]; then python -u scripts/site_pages.py --politiques
          elif [ "${{ inputs.action }}" = "doublons-ean" ]; then python -u scripts/doublons_ean.py
          elif [ "${{ inputs.action }}" = "photos-notino-lot" ]; then python -u scripts/photos_notino_sonde.py --lot
          elif [ "${{ inputs.action }}" = "skincare-pause" ]; then python -u scripts/skincare_pause.py
          elif [ "${{ inputs.action }}" = "photos-notino-sonde" ]; then pip install -q pillow && python -u scripts/photos_notino_sonde.py
          elif [ "${{ inputs.action }}" = "skincare-apercu" ]; then python -u scripts/skincare.py --apercu
          elif [ "${{ inputs.action }}" = "politique-livraison" ]; then python -u scripts/site_pages.py --politiques-nl --seulement livraison
          elif [ "${{ inputs.action }}" = "pages-legales" ]; then python -u scripts/site_pages.py
          elif [ "${{ inputs.action }}" = "photos-adp" ]; then python -u scripts/photos_adp.py
          elif [ "${{ inputs.action }}" = "photos-cadre" ]; then pip install -q pillow numpy && python -u scripts/photos_cadre.py
          elif [ "${{ inputs.action }}" = "photos-hero" ]; then python -u scripts/photos_hero.py
          elif [ "${{ inputs.action }}" = "photos-ici" ]; then python -u scripts/photos_ici.py
          elif [ "${{ inputs.action }}" = "masquer-photos-faibles" ]; then python -u scripts/site_synchro.py --masquer-photos-faibles
          elif [ "${{ inputs.action }}" = "qualite-photos" ]; then python -u scripts/site_synchro.py --qualite-photos
          elif [ "${{ inputs.action }}" = "controle-photos" ]; then python -u scripts/site_synchro.py --controle-photos
          else python -u scripts/site_theme.py --${{ inputs.action }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-${{ github.run_id }}
          path: rapports/theme/
          retention-days: 7
          if-no-files-found: ignore
