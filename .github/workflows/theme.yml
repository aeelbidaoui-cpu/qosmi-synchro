name: Qosmi - theme

on:
  workflow_dispatch:
    inputs:
      action:
        description: "exporter (lecture seule) ou appliquer (copie non publiée)"
        type: choice
        options: [exporter, appliquer, activer-fiches, photos-marques, controle-photos, menu]
        default: exporter
      essai:
        description: "photos-marques : ne traiter qu'une fiche dont la photo vient de ce site (ex. parfumerie.be)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuser de tourner si le dépôt est public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prive=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$prive" != "true" ]; then echo "::error::Le dépôt est PUBLIC : arrêt."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Thème
        env:
          SHOPIFY_BOUTIQUE: ${{ secrets.SHOPIFY_BOUTIQUE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          WF_URL: ${{ secrets.WF_URL }}
          PHOTOS_ESSAI: ${{ inputs.essai }}
        run: |
          if [ "${{ inputs.action }}" = "activer-fiches" ]; then python -u scripts/site_synchro.py --activer
          elif [ "${{ inputs.action }}" = "photos-marques" ]; then
            if [ -z "$PHOTOS_ESSAI" ]; then python -u scripts/photos_marques.py; fi
            python -u scripts/site_synchro.py --photos-marques
          elif [ "${{ inputs.action }}" = "controle-photos" ]; then python -u scripts/site_synchro.py --controle-photos
          else python -u scripts/site_theme.py --${{ inputs.action }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-${{ github.run_id }}
          path: rapports/theme/
          retention-days: 7
          if-no-files-found: ignore
