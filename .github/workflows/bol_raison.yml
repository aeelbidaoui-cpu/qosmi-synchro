name: Qosmi - bol pourquoi pas en vente

# 24/11/2026 (Amine) : pourquoi un EAN n'est pas en vente sur bol. Lecture seule, sans prix dans le journal (dépôt public),
# groupe séparé : ne bloque pas la mise à jour bol.

on:
  workflow_dispatch:
    inputs:
      eans:
        description: "EAN (séparés par des virgules)"
        required: true

concurrency:
  group: qosmi-bol-raison
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reprendre les relevés bol
        uses: actions/cache/restore@v4
        with:
          path: base/bol_marche.json
          key: bol-${{ github.run_id }}
          restore-keys: bol-
      - name: Reprendre le catalogue Rituals
        uses: actions/cache/restore@v4
        with:
          path: base/rituals_catalogue.json
          key: rituals-${{ github.run_id }}
          restore-keys: rituals-
      - name: Reprendre l'état de la publication (refus bol)
        uses: actions/cache/restore@v4
        with:
          path: base/bol_refus.json
          key: bolpub-${{ github.run_id }}
          restore-keys: bolpub-
      - name: Raison
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          TRISTA_URL: ${{ secrets.TRISTA_URL }}
          EANS: ${{ inputs.eans }}
        run: |
          mkdir -p base rapports
          python -u scripts/bol_raison.py
