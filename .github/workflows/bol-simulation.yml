name: Qosmi - bol simulation (lecture seule)

# 22/11/2026 (Amine : « si on descendait notre bénéfice à 3 €… ») : simulations bol qui ne publient rien et ne touchent
# pas aux relevés (caches seulement relus), lancées à la main, sans attendre la file du passage bol. Pas de planification.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "simulation-marge ou ean-detail (lecture seule)"
        type: choice
        options: [simulation-marge, ean-detail]
        default: simulation-marge
      eans:
        description: "ean-detail : EAN séparés par des virgules"
        type: string
        default: ""
      marge:
        description: "Bénéfice net minimum simulé partout (euros)"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: qosmi-bol-simulation
  cancel-in-progress: false

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: base/bol_marche.json
          key: bol-${{ github.run_id }}
          restore-keys: bol-
      - uses: actions/cache/restore@v4
        with:
          path: base/rituals_catalogue.json
          key: rituals-${{ github.run_id }}
          restore-keys: rituals-
      - name: Simulation
        env:
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          TRISTA_URL: ${{ secrets.TRISTA_URL }}
          MARGE: ${{ inputs.marge }}
          EANS: ${{ inputs.eans }}
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.action }}" = "ean-detail" ]; then
            python -u scripts/bol_ean_detail.py && K=$(openssl rand -hex 32) && echo -n "$K" > /tmp/k && \
            openssl enc -aes-256-cbc -pbkdf2 -salt -in rapports/ean_detail.txt -out /tmp/r.enc -pass file:/tmp/k && \
            openssl pkeyutl -encrypt -pubin -inkey config/cle_rapports.pem -in /tmp/k -out /tmp/k.enc && \
            echo "=== CLE_CHIFFREE" && base64 -w0 /tmp/k.enc && echo && echo "=== RAPPORT_CHIFFRE" && base64 -w 1000 /tmp/r.enc && echo && echo "=== FIN"
          else
            python -u scripts/bol_simulation_marge.py --marge "${MARGE:-3}"
          fi
