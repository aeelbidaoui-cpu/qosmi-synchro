name: Qosmi - bol.com

on:
  schedule:
    - cron: "41 */6 * * *"   # toutes les 6 heures UTC (rétabli le 10/11/2026 : dépôt public, minutes illimitées) : relevé bol + décisions
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire ?"
        type: choice
        default: analyse
        options: [analyse, test-connexion, recalculer, publier, essai-publication, contenu-diag, contenu-auto, contenu-envoyer, contenu-rapport, offres-test, contenu-images, controle-images, contenu-images-4004, bonnes-affaires, commandes-detail, rituals-fiches, rituals-fiches-essai, rituals-diag, rituals-photos, rituals-obligatoires, rituals-simulation, deloox-candidats, deloox-opportunites, simulation-marge]
      maxi:
        description: "Nombre maximum d'EAN à relever (vide = tous, dans la limite de durée)"
        required: false
        default: ""

concurrency:
  group: qosmi-bol
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bol:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Refuser de tourner si le dépôt est public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prive=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "Dépôt privé : $prive (10/11/2026 : Amine a choisi de passer le dépôt en public ; plus d'arrêt)"
          echo "PRIVE=$prive" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier que l'accès bol est enregistré
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
        run: |
          if [ -z "$BOL_CLIENT_ID" ]; then
            echo "::warning::Secrets BOL_CLIENT_ID / BOL_CLIENT_SECRET absents : lancer « 31 - bol - Copier l'acces bol pour GitHub » sur le Mac."
            echo "ABSENT=1" >> "$GITHUB_ENV"
          fi

      - name: Reprendre les relevés précédents
        if: env.ABSENT != '1'
        uses: actions/cache/restore@v4
        with:
          path: base/bol_marche.json
          key: bol-${{ github.run_id }}
          restore-keys: bol-

      - name: Reprendre le catalogue Rituals (relu toutes les 20 h)
        if: env.ABSENT != '1'
        uses: actions/cache/restore@v4
        with:
          path: base/rituals_catalogue.json
          key: rituals-${{ github.run_id }}
          restore-keys: rituals-

      - name: Reprendre les envois de fiches Rituals
        if: env.ABSENT != '1'
        uses: actions/cache/restore@v4
        with:
          path: base/bol_rituals_envois.json
          key: ritenv-${{ github.run_id }}
          restore-keys: ritenv-

      - name: Reprendre l'état de la publication (refus bol)
        if: env.ABSENT != '1'
        uses: actions/cache/restore@v4
        with:
          path: base/bol_refus.json
          key: bolpub-${{ github.run_id }}
          restore-keys: bolpub-

      - name: bol
        if: env.ABSENT != '1'
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          SOLELUNA_EMAIL: ${{ secrets.SOLELUNA_EMAIL }}
          SOLELUNA_PASSWORD: ${{ secrets.SOLELUNA_PASSWORD }}
          TRISTA_URL: ${{ secrets.TRISTA_URL }}
        run: |
          mkdir -p base; [ -f base/bol_refus.json ] || echo '{}' > base/bol_refus.json
          A="${{ inputs.action }}"; [ -z "$A" ] && A=analyse
          M="${{ inputs.maxi }}"
          if [ "$A" = "test-connexion" ]; then python -u scripts/bol_api.py --test
          elif [ "$A" = "recalculer" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py
          elif [ "$A" = "publier" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py
          elif [ "$A" = "contenu-diag" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_contenu.py --diag
          elif [ "$A" = "contenu-auto" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_contenu.py --diag --auto
          elif [ "$A" = "contenu-rapport" ]; then python -u scripts/bol_contenu.py --rapport config/bol_contenu_envois_controle.json
          elif [ "$A" = "contenu-images" ]; then python -u scripts/bol_contenu.py --images
          elif [ "$A" = "controle-images" ]; then python -u scripts/bol_contenu.py --controle-images
          elif [ "$A" = "contenu-images-4004" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_contenu.py --images-4004
          elif [ "$A" = "bonnes-affaires" ]; then python -u scripts/bol_bonnes_affaires.py && \
            K=$(openssl rand -hex 32) && echo -n "$K" > /tmp/k && \
            openssl enc -aes-256-cbc -pbkdf2 -salt -in rapports/bonnes_affaires.csv -out /tmp/r.enc -pass file:/tmp/k && \
            openssl pkeyutl -encrypt -pubin -inkey config/cle_rapports.pem -in /tmp/k -out /tmp/k.enc && \
            echo "=== CLE_CHIFFREE" && base64 -w0 /tmp/k.enc && echo && echo "=== RAPPORT_CHIFFRE" && base64 -w0 /tmp/r.enc && echo && echo "=== FIN"
          elif [ "$A" = "commandes-detail" ]; then python -u scripts/bol_commandes_detail.py && \
            K=$(openssl rand -hex 32) && echo -n "$K" > /tmp/k && \
            openssl enc -aes-256-cbc -pbkdf2 -salt -in rapports/commandes_detail.csv -out /tmp/r.enc -pass file:/tmp/k && \
            openssl pkeyutl -encrypt -pubin -inkey config/cle_rapports.pem -in /tmp/k -out /tmp/k.enc && \
            echo "=== CLE_CHIFFREE" && base64 -w0 /tmp/k.enc && echo && echo "=== RAPPORT_CHIFFRE" && base64 -w0 /tmp/r.enc && echo && echo "=== FIN"
          elif [ "$A" = "rituals-fiches" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_rituals_fiches.py
          elif [ "$A" = "rituals-photos" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_rituals_fiches.py --photos
          elif [ "$A" = "rituals-fiches-essai" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_rituals_fiches.py --essai
          elif [ "$A" = "rituals-obligatoires" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_rituals_fiches.py --obligatoires
          elif [ "$A" = "deloox-candidats" ] || [ "$A" = "deloox-opportunites" ]; then \
            if [ "$A" = "deloox-candidats" ]; then python -u scripts/bol_deloox.py --candidats; F=rapports/deloox_candidats.csv; else python -u scripts/bol_deloox.py --opportunites ${M:+--marge $M}; F=rapports/deloox_opportunites.csv; fi && \
            K=$(openssl rand -hex 32) && echo -n "$K" > /tmp/k && \
            openssl enc -aes-256-cbc -pbkdf2 -salt -in $F -out /tmp/r.enc -pass file:/tmp/k && \
            openssl pkeyutl -encrypt -pubin -inkey config/cle_rapports.pem -in /tmp/k -out /tmp/k.enc && \
            echo "=== CLE_CHIFFREE" && base64 -w0 /tmp/k.enc && echo && echo "=== RAPPORT_CHIFFRE" && base64 -w 1000 /tmp/r.enc && echo && echo "=== FIN"
          elif [ "$A" = "simulation-marge" ]; then python -u scripts/bol_simulation_marge.py ${M:+--marge $M}
          elif [ "$A" = "rituals-simulation" ]; then python -u scripts/bol_simulation_rituals.py; python -u scripts/bol_simulation_deloox.py; \
            python -u scripts/bol_deloox.py --candidats && K=$(openssl rand -hex 32) && echo -n "$K" > /tmp/k && \
            openssl enc -aes-256-cbc -pbkdf2 -salt -in rapports/deloox_candidats.csv -out /tmp/r.enc -pass file:/tmp/k && \
            openssl pkeyutl -encrypt -pubin -inkey config/cle_rapports.pem -in /tmp/k -out /tmp/k.enc && \
            echo "=== CLE_CHIFFREE" && base64 -w0 /tmp/k.enc && echo && echo "=== RAPPORT_CHIFFRE" && base64 -w0 /tmp/r.enc && echo && echo "=== FIN"
          elif [ "$A" = "rituals-diag" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py && python -u scripts/bol_rituals_fiches.py --diag
          elif [ "$A" = "offres-test" ]; then python -u scripts/bol_contenu.py --offres-test
          elif [ "$A" = "contenu-envoyer" ]; then python -u scripts/bol_contenu.py --envoyer
          elif [ "$A" = "essai-publication" ]; then python -u scripts/bol_analyse.py --sans-releve && python -u scripts/bol_publier.py --essai
          elif [ -n "$M" ]; then python -u scripts/bol_analyse.py --max "$M" && python -u scripts/bol_publier.py
          else python -u scripts/bol_analyse.py && python -u scripts/bol_publier.py; fi

      - name: Garder les envois de fiches Rituals
        if: always() && env.ABSENT != '1' && hashFiles('base/bol_rituals_envois.json') != ''
        uses: actions/cache/save@v4
        with:
          path: base/bol_rituals_envois.json
          key: ritenv-${{ github.run_id }}

      - name: Garder le catalogue Rituals
        if: always() && env.ABSENT != '1' && hashFiles('base/rituals_catalogue.json') != ''
        uses: actions/cache/save@v4
        with:
          path: base/rituals_catalogue.json
          key: rituals-${{ github.run_id }}

      - name: Garder les relevés pour le prochain passage
        if: always() && env.ABSENT != '1'
        uses: actions/cache/save@v4
        with:
          path: base/bol_marche.json
          key: bol-${{ github.run_id }}

      - name: Garder l'état de la publication
        if: always() && env.ABSENT != '1'
        uses: actions/cache/save@v4
        with:
          path: base/bol_refus.json
          key: bolpub-${{ github.run_id }}

      # 17/11/2026 : ces rapports contiennent des coûts ; un artefact d'un dépôt public est téléchargeable par n'importe
      # quel compte GitHub, donc on ne les dépose que si le dépôt est privé (prévu le 01/12/2026).
      - name: Rapport (interne, confidentiel)
        if: always() && env.ABSENT != '1' && env.PRIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bol-analyse-${{ github.run_id }}
          path: |
            rapports/bol_analyse.csv
            rapports/bol_analyse.txt
            rapports/bol_publication.csv
            rapports/bol_publication.txt
            rapports/bol_commandes.txt
            rapports/bol_invisibles.json
            rapports/bol_contenu_diag.json
            rapports/bol_contenu_envois.json
            rapports/bol_contenu_auto.json
            rapports/bol_controle_images.json
          retention-days: 14
          if-no-files-found: ignore
