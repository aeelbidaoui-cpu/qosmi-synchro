name: Qosmi - journal

# Publie les articles du Journal (blog/articles/*.json) dès qu'un article est ajouté ou modifié.
on:
  push:
    branches: [main]
    paths: ["blog/articles/**"]
  schedule:
    - cron: "53 5 * * *"   # chaque matin (accord d'Amine du 10/11/2026) : remet à jour les photos des fiches citées dans les articles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuser de tourner si le dépôt est public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prive=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "Dépôt privé : $prive (10/11/2026 : Amine a choisi de passer le dépôt en public ; plus d'arrêt)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôle des articles
        run: python -u scripts/blog.py --essai
      - name: Publication
        env:
          SHOPIFY_BOUTIQUE: ${{ secrets.SHOPIFY_BOUTIQUE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: pip install -q pillow && python -u scripts/blog.py
