name: Qosmi - bol bilan du contenu

# 24/11/2026 (Amine : « complète ce que bol demande ») : quelles informations bol réclame sur nos offres invisibles.
# Lecture seule, aucun prix ni fournisseur dans le rapport ; groupe séparé (ne bloque pas la mise à jour bol).

on:
  workflow_dispatch:

concurrency:
  group: qosmi-bol-contenu-bilan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bilan
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: |
          mkdir -p base rapports
          python -u scripts/bol_contenu_bilan.py
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bol-contenu-bilan
          path: rapports/bol_contenu_bilan.json
          if-no-files-found: ignore
